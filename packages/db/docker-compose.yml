name: switchyard

services:
  postgres:
    image: postgres:18
    container_name: switchyard-postgres
    environment:
      POSTGRES_DB: switchyard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - switchyard_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Catches every email the server sends in development: SMTP on 1025, inbox
  # on http://localhost:8025.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: switchyard-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  switchyard_postgres_data:
